name: Deploy Amoye AI to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine GitHub Pages base path
        id: pages_base
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER_PAGES="${{ github.repository_owner }}.github.io"
          if [ "${REPO_NAME,,}" = "${OWNER_PAGES,,}" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages_base.outputs.base }}
          VITE_WHATSAPP_COMMUNITY_INVITE_URL: ${{ vars.VITE_WHATSAPP_COMMUNITY_INVITE_URL }}
        run: npm run build

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
